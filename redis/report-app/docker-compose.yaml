services:
  cache-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - REDIS_HOST=localhost
      - REDIS_PORT=6379
      - PORT=5000
      - CACHE_TTL_SECONDS=30
      - SIMULATED_DELAY_SECONDS=2
    network_mode: "host"
    restart: always
